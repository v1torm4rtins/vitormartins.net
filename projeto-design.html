<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Design | Vitor Martins</title>

    <link rel="preload" href="fonts/ZalandoSansExpanded-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/ZalandoSansExpanded-Medium.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+Expanded:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/portfolio.css" />
    <link rel="stylesheet" href="css/portfolio-individual.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <link rel="icon" href="img/favicon-red-vitor-martins.png" type="image/png">
</head>

<body class="pg-projeto-detalhe">
    <div id="header-placeholder"></div>

    <main>
        <section class="page-title light-purple-maze-bg">
            <div class="container">
                <h1 id="projeto-titulo" class="title-section">Carregando...</h1>
            </div>
        </section>

        <section class="visualizacao-projeto">
            <div class="container">
                <div class="info-projeto-topo">
                    <h4 class="tec-title">Tecnologias utilizadas</h4>
                    <div id="projeto-tecs" class="icones-tecnologias"></div>
                </div>

                <div class="wrapper-carrossel">
                    <button class="nav-carrossel prev" id="prev-btn">
                        <img src="svg/arrow-left.svg" alt="Anterior">
                    </button>

                    <div class="moldura-pc carrossel">
                        <div id="container-carrossel" class="carrossel-interno">
                        </div>
                    </div>

                    <button class="nav-carrossel next" id="next-btn">
                        <img src="svg/arrow-right.svg" alt="Próximo">
                    </button>
                </div>

            </div>
        </section>

        <section class="descricao-detalhada light-section">
            <div class="container">
                <p id="projeto-descricao"></p>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="js/main.js"></script>
    <script src="js/projeto-detalhes.js"></script>
</body>

</html>
