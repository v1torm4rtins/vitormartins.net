<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front-end | Vitor Martins</title>

    <link rel="preload" href="fonts/ZalandoSansExpanded-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/ZalandoSansExpanded-Medium.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/hero.css" />
    <link rel="stylesheet" href="css/inicio.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <link rel="icon" href="img/favicon-red-vitor-martins.png" type="image/png">
</head>

<body class="pg-front-end">
    <div id="header-placeholder"></div>

    <main>
        <section class="page-title">
            <div class="container">
                <h1>Front-end</h1>
            </div>
        </section>

        <section class="lista-portfolio">
            <div class="container">
                <div class="filtros-container">
                    <button class="btn-filtro active" data-filter="all">Todos</button>
                    <button class="btn-filtro" data-filter="sites">Sites</button>
                    <button class="btn-filtro" data-filter="onepages">Onepages</button>
                    <button class="btn-filtro" data-filter="portfolios">Portfólios</button>
                    <button class="btn-filtro" data-filter="blogs">Blogs</button>
                </div>

                <div id="lista-projetos-front" class="grid-portfolio">
                </div>
            </div>
        </section>

    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/portfolio.js"></script>
</body>

</html>
