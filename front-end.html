<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front-end | Vitor Martins</title>

    <link rel="preload" href="fonts/ZalandoSansExpanded-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/ZalandoSansExpanded-Medium.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+Expanded:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/portfolio.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <link rel="icon" href="img/favicon-red-vitor-martins.png" type="image/png">
</head>

<body class="pg-front-end">
    <div id="header-placeholder"></div>

    <main>
        <section class="page-title light-purple-maze-bg">
            <div class="container">
                <h1 class="title-section">Front-end</h1>
            </div>
        </section>

        <section class="lista-portfolio gray-section">
            <div class="container">
                <div class="filtros-container small-bottom-margin">
                    <button class="btn-filtro active" data-filter="all">Todos</button>
                    <button class="btn-filtro" data-filter="site">Site</button>
                    <button class="btn-filtro" data-filter="onepage">Onepage</button>
                    <button class="btn-filtro" data-filter="portfolio">Portfólio</button>
                    <button class="btn-filtro" data-filter="blog">Blog</button>
                </div>

                <div id="lista-projetos-front" class="grid-portfolio">
                </div>
            </div>
        </section>

        <div id="footer-placeholder"></div>
    </main>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/portfolio.js"></script>
</body>

</html>
