<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Front-end | Vitor Martins</title>

    <link rel="preload" href="fonts/ZalandoSansExpanded-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/ZalandoSansExpanded-Medium.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+Expanded:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/portfolio.css" />
    <link rel="stylesheet" href="css/portfolio-individual.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <link rel="icon" href="img/favicon-red-vitor-martins.png" type="image/png">
</head>

<body class="pg-projeto-detalhe">
    <div id="header-placeholder"></div>

    <main>
        <section class="page-title light-purple-maze-bg">
            <div class="container">
                <h1 id="projeto-titulo" class="title-section">Carregando...</h1>
            </div>
        </section>

        <section class="visualizacao-projeto gray-section">
            <div class="container">
                <div class="info-projeto-topo">
                    <h3 class="tec-title">Tecnologias utilizadas</h3>
                    <div id="projeto-tecs" class="icones-tecnologias"></div>
                </div>
                <div class="moldura-pc">
                    <div id="container-imagem-scroll" class="scroll-interno">
                    </div>
                </div>
                <div class="acoes-projeto">
                    <a id="btn-link-projeto" href="#" class="button-open-site" target="_blank">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26.6 26.6" class="icon-open-arrow">
                            <polygon
                                points="2.12 0 2.12 6 16.35 6 0 22.35 4.24 26.6 20.6 10.24 20.6 24.47 26.6 24.47 26.6 0 2.12 0" />
                        </svg>

                        <span>
                            Acessar o site online
                        </span>
                    </a>
                </div>
            </div>
        </section>

        <section class="descricao-detalhada light-section">
            <div class="container">
                <h3 class="tec-title black-text small-bottom-margin">Descrição</h3>
                <p id="projeto-descricao"></p>
            </div>
        </section>

        <section class="projetos-relacionados dark-section">
            <div class="container">
                <h3 class="tec-title medium-bottom-margin center-content">Projetos relacionados</h3>
                <div id="lista-relacionados" class="grid-relacionados">
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="js/main.js"></script>
    <script src="js/projeto-detalhes.js"></script>
</body>

</html>
